<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸间 · 文档空间</title><link rel="stylesheet" href="style.css"></head>
<body><aside id="sidebar"><div class="brand"><span class="logo">纸</span><div>纸间<small>留一处空间，给你的想法</small></div></div><button id="add" class="primary"><b>＋</b> 新建文档 <kbd>Alt N</kbd></button><label class="search"><span>⌕</span><input id="search" placeholder="搜索文档…" aria-label="搜索文档"></label><div class="list-heading"><span>我的文档</span><span id="count"></span></div><nav id="list" aria-label="文档列表"></nav><div class="side-footer"><span class="local-dot"></span> 保存在此浏览器 <span class="footer-note">随写 · 随存</span></div></aside>
<main><header><div class="breadcrumb"><button id="menu" aria-label="切换文档列表">☰</button><span>我的文档</span><span class="slash">/</span><strong id="crumb"></strong></div><div class="actions"><span id="save" role="status">已保存</span><button id="export" title="导出为文本">↗ <span>导出</span></button><button id="delete" class="danger" title="删除当前文档" aria-label="删除当前文档">删除</button></div></header><div class="canvas"><article id="editor"><div class="eyebrow"><span></span> 自由书写，让想法发生</div><input id="title" aria-label="文档标题" placeholder="无标题文档" maxlength="200"><div class="meta"><span id="date"></span><span>·</span><span id="words"></span></div><div class="divider"></div><textarea id="body" aria-label="文档正文" placeholder="从这里开始，写下你的第一个想法…" spellcheck="false"></textarea><div class="page-end">— <span>每一个想法，都值得被记下</span> —</div></article><section id="empty" hidden><div class="empty-icon">▤</div><h1>新的想法，从一张白纸开始</h1><p>创建第一篇文档，收集灵感与日常。</p><button id="empty-add" class="primary">＋ 新建文档</button></section></div><footer><span>纸间 / YOUR QUIET SPACE</span><span>内容自动保存在当前设备的浏览器中</span></footer></main><div id="toast" role="status" hidden></div><dialog id="confirm"><h2>删除这篇文档？</h2><p id="delete-message"></p><div><button id="cancel">保留文档</button><button id="confirm-delete" class="primary">确认删除</button></div></dialog><script src="app.js"></script></body></html>
